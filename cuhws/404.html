<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Pàgina no trobada</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #11141a;
      color: #ffffff;
      text-align: center;
      padding: 60px 20px;
      margin: 0;
    }
    .card {
      max-width: 500px;
      margin: 0 auto;
      background: #1a1f29;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 30px;
    }
    h2 {
      margin-top: 0;
      color: #f87171;
      font-size: 24px;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.5;
    }
    a.btn {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 18px;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-weight: 700;
      border-radius: 6px;
      font-size: 14px;
    }
    a.btn:hover {
      background: #7dd3fc;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>404 - Pàgina No Trobada</h2>
    <p>El recurs o pàgina que heu sol·licitat no existeix o ha canviat d'adreça.</p>
    <a href="/" class="btn">&larr; Tornar a l'inici</a>

</html>
