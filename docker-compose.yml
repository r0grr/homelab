services:
  # ============================================================================
  # 1. HOME ASSISTANT
  # Requiere network_mode: host para descubrimiento mDNS, SSDP e integración Tuya.
  # ============================================================================
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - /opt/servidor/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
      - /sys/devices/virtual/powercap:/host_powercap:ro

  # ============================================================================
  # 2. MOSQUITTO MQTT BROKER
  # Broker de mensajería central que desacopla hardware y consumidores.
  # ============================================================================
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - /opt/servidor/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - /opt/servidor/mosquitto/data:/mosquitto/data
    networks:
      - homelab-net

  # ============================================================================
  # 3. CUMULUS MX (Estación Meteorológica Davis Vantage Pro2)
  # Mapeo directo de puertos serie hardware COM1 (/dev/ttyS0) y COM2 (/dev/ttyS1).
  # ============================================================================
  cumulusmx:
    image: ghcr.io/hucknz/cumulusmx:v4
    container_name: cumulusmx
    restart: unless-stopped
    ports:
      - "8998:8998"
    devices:
      - /dev/ttyS0:/dev/ttyS0
      - /dev/ttyS1:/dev/ttyS1
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - /opt/servidor/cumulusmx/data:/opt/CumulusMX/data
      - /opt/servidor/cumulusmx/config:/opt/CumulusMX/config
      - /opt/servidor/cumulusmx/reports:/opt/CumulusMX/Reports
      - /opt/servidor/cumulusmx/web:/opt/CumulusMX/web
      - /opt/servidor/cumulusmx/strings.ini:/opt/CumulusMX/strings.ini
      - /opt/servidor/cumulusmx/interface_override/index.html:/opt/CumulusMX/interface/index.html:ro
      - /opt/servidor/cumulusmx/ai2_catalan/index.html:/opt/CumulusMX/interface/ai2/index.html:ro
      - /opt/servidor/cumulusmx/ai2_catalan/menus.html:/opt/CumulusMX/interface/ai2/menus.html:ro
      - /opt/servidor/cumulusmx/ai2_catalan/gauges.html:/opt/CumulusMX/interface/ai2/gauges.html:ro
      - /opt/servidor/cumulusmx/ai2_catalan/ai-page-manager.js:/opt/CumulusMX/interface/ai2/js/ai-page-manager.js:ro
      - /opt/servidor/cumulusmx/ai2_catalan/main.css:/opt/CumulusMX/interface/ai2/css/main.css:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - homelab-net

  # ============================================================================
  # 4. SOLAREDGE BOT & TELEMETRÍA SOLAR (Microservicio Unificado)
  # Consulta API SolarEdge, publica a Mosquitto (solar/*) y atiende Telegram.
  # ============================================================================
  solaredge-bot:
    build:
      context: ./scripts/solaredge_bot
    container_name: solaredge-bot
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_PORT=${MQTT_PORT:-1883}
      - SOLAREDGE_SITE_ID=${SOLAREDGE_SITE_ID}
      - SOLAREDGE_API_KEY=${SOLAREDGE_API_KEY}
      - SOLAR_POLL_INTERVAL_SEC=${SOLAR_POLL_INTERVAL_SEC:-600}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - QUIET_START_HOUR=${QUIET_START_HOUR:-22}
      - QUIET_END_HOUR=${QUIET_END_HOUR:-8}
    volumes:
      - /opt/servidor/scripts/solaredge_bot/memoria.json:/app/memoria.json
    depends_on:
      - mosquitto
    networks:
      - homelab-net

  # ============================================================================
  # 5. SOLAREDGE PRO WEB DASHBOARD (React + Vite)
  # Panel web visual interactivo con gráficas y flujo de energía en tiempo real.
  # ============================================================================
  solaredge-dashboard:
    build:
      context: ./scripts/solaredge_dashboard
    container_name: solaredge-dashboard
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - VITE_SOLAREDGE_SITE_ID=${SOLAREDGE_SITE_ID}
      - VITE_SOLAREDGE_API_KEY=${SOLAREDGE_API_KEY}
    volumes:
      - /opt/servidor/scripts/solaredge_dashboard/src:/app/src
      - /opt/servidor/scripts/solaredge_dashboard/vite.config.ts:/app/vite.config.ts
    networks:
      - homelab-net

  # ============================================================================
  # 6. WEB TERMINAL & SSH (Mòdul de Terminal Web per a Home Assistant)
  # Accés a shell interactiva per navegador i des del menú lateral d'HA.
  # ============================================================================
  web-terminal:
    build:
      context: ./scripts/web_terminal
    container_name: web-terminal
    restart: unless-stopped
    ports:
      - "7681:7681"
    networks:
      - homelab-net

  # ============================================================================
  # 7. CLOUDFLARE ZERO TRUST TUNNEL
  # Túnel saliente seguro sin apertura de puertos en el router.
  # Perfil 'tunnel' para activación en la fase final con zona DNS.
  # ============================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - /opt/servidor/cloudflared:/etc/cloudflared
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - homelab-net
    profiles:
      - tunnel
  # ============================================================================
  # 8. WEATHER34 DASHBOARD (Panell Meteorològic per a MeteoSallent)
  # Interfície web Weather34 / CU-HWS optimitzada per a Cumulus MX i Davis VP2+.
  # ============================================================================
  weather34:
    image: php:8.2-apache
    container_name: weather34
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - /opt/servidor/cuhws:/var/www/html
      - /opt/servidor/cumulusmx/web:/var/www/html/cumulusdata:ro
      - /opt/servidor/cumulusmx/data:/var/www/html/cumulusmxdata:ro
      - /opt/servidor/cuhws/custom-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - /opt/servidor/cuhws/apache-security.conf:/etc/apache2/conf-available/security.conf:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - homelab-net

  # ============================================================================
  # 9. FILE BROWSER (Gestor de Fitxers Web per a Home Assistant)
  # Explorador de fitxers, cerca i editor de text per a tot /opt/servidor.
  # ============================================================================
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - /opt/servidor:/srv/servidor
      - /mnt/backups:/srv/disc_copies_sata
      - ${HOST_USER_HOME:-/home/user}:/srv/home_user
      - /opt/servidor/filebrowser/data:/database
    networks:
      - homelab-net

  # ============================================================================
  # 10. CADDY REVERSE PROXY (HTTPS Automàtic Let's Encrypt i Seguretat Pública)
  # ============================================================================
  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "7880:7880"
    volumes:
      - /opt/servidor/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/servidor/caddy/data:/data
      - /opt/servidor/caddy/config:/config
      - /opt/servidor/caddy/logs:/var/log/caddy
      - /opt/servidor/goaccess/report:/srv/goaccess:ro
    networks:
      - homelab-net

  # ============================================================================
  # 11. GOACCESS (Panell d'Analítica i Monitoratge d'Accessos Web en Temps Real)
  # ============================================================================
  goaccess:
    image: allinurl/goaccess:latest
    container_name: goaccess
    restart: unless-stopped
    command: >
      /var/log/caddy/access.log
      -o /srv/goaccess/index.html
      --log-format=CADDY
      --real-time-html
      --addr=0.0.0.0
      --port=7890
    volumes:
      - /opt/servidor/caddy/logs:/var/log/caddy:ro
      - /opt/servidor/goaccess/report:/srv/goaccess
    ports:
      - "7890:7890"
    networks:
      - homelab-net


networks:
  homelab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
