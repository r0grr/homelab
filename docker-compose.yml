services:
  # ============================================================================
  # 1. HOME ASSISTANT
  # Requiere network_mode: host para descubrimiento mDNS, SSDP e integración Tuya.
  # ============================================================================
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - /opt/servidor/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro

  # ============================================================================
  # 2. MOSQUITTO MQTT BROKER
  # Broker de mensajería central que desacopla hardware y consumidores.
  # ============================================================================
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - /opt/servidor/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - /opt/servidor/mosquitto/data:/mosquitto/data
    networks:
      - homelab-net

  # ============================================================================
  # 3. CUMULUS MX (Estación Meteorológica Davis Vantage Pro2)
  # Mapeo directo de puertos serie hardware COM1 (/dev/ttyS0) y COM2 (/dev/ttyS1).
  # ============================================================================
  cumulusmx:
    image: ghcr.io/hucknz/cumulusmx:v4
    container_name: cumulusmx
    restart: unless-stopped
    ports:
      - "8998:8998"
    devices:
      - /dev/ttyS0:/dev/ttyS0
      - /dev/ttyS1:/dev/ttyS1
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - /opt/servidor/cumulusmx/data:/opt/CumulusMX/data
      - /opt/servidor/cumulusmx/config:/opt/CumulusMX/config
      - /etc/localtime:/etc/localtime:ro
    networks:
      - homelab-net

  # ============================================================================
  # 4. SOLAREDGE BOT & TELEMETRÍA SOLAR (Microservicio Unificado)
  # Consulta API SolarEdge, publica a Mosquitto (solar/*) y atiende Telegram.
  # ============================================================================
  solaredge-bot:
    build:
      context: ./scripts/solaredge_bot
    container_name: solaredge-bot
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_PORT=${MQTT_PORT:-1883}
      - SOLAREDGE_SITE_ID=${SOLAREDGE_SITE_ID}
      - SOLAREDGE_API_KEY=${SOLAREDGE_API_KEY}
      - SOLAR_POLL_INTERVAL_SEC=${SOLAR_POLL_INTERVAL_SEC:-600}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - QUIET_START_HOUR=${QUIET_START_HOUR:-22}
      - QUIET_END_HOUR=${QUIET_END_HOUR:-8}
    volumes:
      - /opt/servidor/scripts/solaredge_bot/memoria.json:/app/memoria.json
    depends_on:
      - mosquitto
    networks:
      - homelab-net

  # ============================================================================
  # 5. SOLAREDGE PRO WEB DASHBOARD (React + Vite)
  # Panel web visual interactivo con gráficas y flujo de energía en tiempo real.
  # ============================================================================
  solaredge-dashboard:
    build:
      context: ./scripts/solaredge_dashboard
    container_name: solaredge-dashboard
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - VITE_SOLAREDGE_SITE_ID=${SOLAREDGE_SITE_ID}
      - VITE_SOLAREDGE_API_KEY=${SOLAREDGE_API_KEY}
    networks:
      - homelab-net

  # ============================================================================
  # 6. CLOUDFLARE ZERO TRUST TUNNEL
  # Túnel saliente seguro sin apertura de puertos en el router.
  # Perfil 'tunnel' para activación en la fase final con zona DNS.
  # ============================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - homelab-net
    profiles:
      - tunnel

networks:
  homelab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
