title: Routers i Xarxa
views:
  - title: Routers i Xarxa
    path: routers
    icon: mdi:router-network
    cards:
      # ========================================================================
      # RESUM D'ESTAT GENERAL DE LA XARXA
      # ========================================================================
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              # 🌐 Infraestructura de Xarxa i Routers
              Estat de connexió i gestió de la línia de fibra òptica (**Vera Connecta**) i la xarxa local domèstica d'alt rendiment (**ASUS ROG & AiMesh**).
          - type: horizontal-stack
            cards:
              - type: entity
                entity: binary_sensor.estat_router_vera_huawei
                name: Vera Fibra (192.168.1.1)
                icon: mdi:wan
              - type: entity
                entity: binary_sensor.estat_router_asus_principal
                name: ASUS Master (192.168.2.1)
                icon: mdi:router-wireless
              - type: entity
                entity: binary_sensor.estat_node_aimesh_asus
                name: Node AiMesh (192.168.2.194)
                icon: mdi:access-point-network

      # ========================================================================
      # 1. ROUTER VERA (FIBRA ÒPTICA GPON)
      # ========================================================================
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ### 🌐 1. Router de Fibra Vera (Huawei HG8245H)
              Terminal ONT GPON connectat directament a la fibra fins a la central i subministrant accés a Internet al router ASUS ROG.
          - type: entities
            title: Informació de la Línia de Fibra Vera
            entities:
              - type: attribute
                entity: binary_sensor.estat_router_vera_huawei
                name: Model Dispositiu
                attribute: model
                icon: mdi:devices
              - type: attribute
                entity: binary_sensor.estat_router_vera_huawei
                name: IP LAN Gestió
                attribute: lan_ip
                icon: mdi:ip-network
              - type: attribute
                entity: binary_sensor.estat_router_vera_huawei
                name: IP Pública WAN (PPPoE)
                attribute: wan_ip
                icon: mdi:web
              - type: attribute
                entity: binary_sensor.estat_router_vera_huawei
                name: Estat CG-NAT
                attribute: cgnat_status
                icon: mdi:shield-check
              - type: attribute
                entity: binary_sensor.estat_router_vera_huawei
                name: Obertura de Ports (Port Mapping)
                attribute: port_mapping
                icon: mdi:arrow-decision
          - type: horizontal-stack
            cards:
              - type: button
                name: Obrir Panell Huawei (LAN)
                icon: mdi:open-in-new
                tap_action:
                  action: url
                  url_path: "http://192.168.1.1"
              - type: button
                name: Obrir Panell Huawei (Tailscale)
                icon: mdi:shield-link-variant
                tap_action:
                  action: url
                  url_path: "http://100.122.161.66:8082"

      # ========================================================================
      # 2. ROUTER ASUS ROG MASTER (GATEWAY DOMÈSTICA)
      # ========================================================================
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ### 📡 2. Router ASUS ROG Principal (Master Gateway)
              Router d'alt rendiment **ASUS ROG GS-BE18000** com a passarel·la principal (Gateway) per a la xarxa local domèstica (192.168.2.1).
          - type: entities
            title: Router ASUS Principal (Master)
            entities:
              - type: attribute
                entity: binary_sensor.estat_router_asus_principal
                name: Model
                attribute: model
                icon: mdi:devices
              - type: attribute
                entity: binary_sensor.estat_router_asus_principal
                name: IP LAN (Porta d'enllaç)
                attribute: lan_ip
                icon: mdi:ip-network
              - type: attribute
                entity: binary_sensor.estat_router_asus_principal
                name: IP WAN (Xarxa Vera)
                attribute: wan_ip
                icon: mdi:wan
              - type: attribute
                entity: binary_sensor.estat_router_asus_principal
                name: Nom DynDNS Actiu
                attribute: dyndns
                icon: mdi:dns
              - type: attribute
                entity: binary_sensor.estat_router_asus_principal
                name: Redirecció Ports 80 & 443
                attribute: port_forwarding
                icon: mdi:check-circle
          - type: horizontal-stack
            cards:
              - type: button
                name: Obrir ASUS Master (LAN)
                icon: mdi:open-in-new
                tap_action:
                  action: url
                  url_path: "http://192.168.2.1"
              - type: button
                name: Obrir ASUS Master (Tailscale)
                icon: mdi:shield-link-variant
                tap_action:
                  action: url
                  url_path: "http://100.122.161.66:8081"

      # ========================================================================
      # 3. NODE AIMESH ASUS (EXTENSOR DE COBERTURA)
      # ========================================================================
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ### 📶 3. Node AiMesh ASUS (Satèl·lit Planta Superior)
              Punt d'accés Wi-Fi d'extensió de xarxa mesh per a la planta superior (192.168.2.194).
          - type: entities
            title: Node AiMesh ASUS (Satèl·lit)
            entities:
              - type: attribute
                entity: binary_sensor.estat_node_aimesh_asus
                name: Rol a la Xarxa
                attribute: role
                icon: mdi:access-point-network
              - type: attribute
                entity: binary_sensor.estat_node_aimesh_asus
                name: IP LAN Node
                attribute: lan_ip
                icon: mdi:ip
              - type: attribute
                entity: binary_sensor.estat_node_aimesh_asus
                name: Connexió amb el Master
                attribute: master_ip
                icon: mdi:link-variant
          - type: horizontal-stack
            cards:
              - type: button
                name: Obrir Node AiMesh (LAN)
                icon: mdi:open-in-new
                tap_action:
                  action: url
                  url_path: "http://192.168.2.194"
              - type: button
                name: Obrir Node AiMesh (Tailscale)
                icon: mdi:shield-link-variant
                tap_action:
                  action: url
                  url_path: "http://100.122.161.66:8083"
