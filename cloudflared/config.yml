# ==============================================================================
# Cloudflare Zero Trust Tunnel - Configuració d'Ingress Blindada
# Serveis Públics: tempscat.com / meteosallent.cat
# Serveis Privats (HA, Cumulus, Plaques, Terminal): Protegits via Tailscale
# ==============================================================================

originRequest:
  connectTimeout: 10s
  tlsTimeout: 10s
  tcpKeepAlive: 30s
  keepAliveConnections: 100

ingress:
  # 1. BLOQUEIG DE SEGURETAT: Prohibir accés a configuració i contrasenyes des d'Internet
  - hostname: tempscat.com
    path: "^/(easyweathersetup|settings|settings1)\\.php.*$"
    service: http_status:403

  - hostname: www.tempscat.com
    path: "^/(easyweathersetup|settings|settings1)\\.php.*$"
    service: http_status:403

  - hostname: meteosallent.cat
    path: "^/(easyweathersetup|settings|settings1)\\.php.*$"
    service: http_status:403

  - hostname: www.meteosallent.cat
    path: "^/(easyweathersetup|settings|settings1)\\.php.*$"
    service: http_status:403

  - hostname: sallent.tempscat.com
    path: "^/(easyweathersetup|settings|settings1)\\.php.*$"
    service: http_status:403

  # 2. SERVEI PÚBLIC: Web meteorològica Weather34 (Sallent)
  - hostname: tempscat.com
    service: http://weather34:80

  - hostname: www.tempscat.com
    service: http://weather34:80

  - hostname: meteosallent.cat
    service: http://weather34:80

  - hostname: www.meteosallent.cat
    service: http://weather34:80

  - hostname: sallent.tempscat.com
    service: http://weather34:80

  # 3. Regla Catch-All final (Respon 404 a qualsevol petició no autoritzada)
  - service: http_status:404
