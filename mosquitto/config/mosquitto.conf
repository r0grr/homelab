# ==============================================================================
# Mosquitto MQTT Broker Configuration
# Permite comunicación anónima en la red interna para Home Assistant,
# Cumulus MX, Placas Solares y el Bot de Telegram.
# ==============================================================================

listener 1883 0.0.0.0
allow_anonymous true

# Persistencia de mensajes con QoS y Retain
persistence true
persistence_location /mosquitto/data/

# Registro de logs a stdout para docker logs
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

connection_messages true
log_timestamp true
